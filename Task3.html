<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        :root {
            --bg-page: #f4f5f6;
            --calc-body: #ffffff;
            --screen-bg: #f8fafc;
            --btn-num: #f1f5f9;
            --btn-op: #e2e8f0;
            --btn-eq: #0284c7;
            --text-dark: #0f172a;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
        body { background-color: var(--bg-page); min-height: 100vh; padding-top: 65px; display: flex; flex-direction: column; }

        nav { width: 100%; height: 65px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 8%; position: fixed; top: 0; z-index: 100; }
        .logo { font-weight: 700; font-size: 1.1rem; color: var(--text-dark); }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { text-decoration: none; color: var(--text-dark); font-size: 0.9rem; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--btn-eq); }

        .calc-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; }
        
        .calculator { background: var(--calc-body); width: 340px; padding: 24px; border-radius: 32px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.03); }
        
        .screen { background: var(--screen-bg); border-radius: 20px; padding: 24px; text-align: right; min-height: 100px; display: flex; flex-direction: column; justify-content: flex-end; margin-bottom: 20px; border: 1px solid var(--border); word-wrap: break-word; word-break: break-all; }
        .screen .history { font-size: 0.9rem; color: #64748b; margin-bottom: 4px; min-height: 1.2rem; }
        .screen .current { font-size: 2.2rem; font-weight: 600; color: var(--text-dark); }

        .buttons-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        button { aspect-ratio: 1; border: none; border-radius: 50%; font-size: 1.3rem; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.1s; color: var(--text-dark); }
        button:active { transform: scale(0.95); }
        
        .num { background: var(--btn-num); }
        .num:hover { background: #e2e8f0; }
        .op { background: var(--btn-op); }
        .op:hover { background: #cbd5e1; }
        .action { background: #ffeeeb; color: #ea580c; }
        .action:hover { background: #fcd5cc; }
        .equals { background: var(--btn-eq); color: white; }
        .equals:hover { background: #0369a1; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">CALCULATOR</div>
        <div class="nav-links">
            <a href="index.html">Overview</a>
            <a href="Task1.html">Portfolio</a>
            <a href="Task2.html">Landing Page</a>
            <a href="Task3.html" class="active">Calculator</a>
        </div>
    </nav>

    <div class="calc-wrapper">
        <div class="calculator">
            <div class="screen">
                <div id="history" class="history"></div>
                <div id="current" class="current">0</div>
            </div>
            <div class="buttons-grid">
                <button onclick="clearAll()" class="action">AC</button>
                <button onclick="deleteDigit()" class="action">C</button>
                <button onclick="setOp('%')" class="op">%</button>
                <button onclick="setOp('÷')" class="op">÷</button>

                <button onclick="appendNum('7')" class="num">7</button>
                <button onclick="appendNum('8')" class="num">8</button>
                <button onclick="appendNum('9')" class="num">9</button>
                <button onclick="setOp('×')" class="op">×</button>

                <button onclick="appendNum('4')" class="num">4</button>
                <button onclick="appendNum('5')" class="num">5</button>
                <button onclick="appendNum('6')" class="num">6</button>
                <button onclick="setOp('-')" class="op">-</button>

                <button onclick="appendNum('1')" class="num">1</button>
                <button onclick="appendNum('2')" class="num">2</button>
                <button onclick="appendNum('3')" class="num">3</button>
                <button onclick="setOp('+')" class="op">+</button>

                <button onclick="appendNum('0')" style="grid-column: span 2; aspect-ratio: auto; border-radius: 30px;" class="num">0</button>
                <button onclick="appendNum('.')" class="num">.</button>
                <button onclick="compute()" class="equals">=</button>
            </div>
        </div>
    </div>

    <script>
        let currentInput = '';
        let previousInput = '';
        let operation = null;

        const currentDisplay = document.getElementById('current');
        const historyDisplay = document.getElementById('history');

        function appendNum(num) {
            if (num === '.' && currentInput.includes('.')) return;
            if (currentInput === '0' && num !== '.') currentInput = '';
            currentInput += num;
            updateDisplay();
        }

        function updateDisplay() {
            currentDisplay.innerText = currentInput === '' ? '0' : currentInput;
            if (operation != null) {
                historyDisplay.innerText = `${previousInput} ${operation}`;
            } else {
                historyDisplay.innerText = '';
            }
        }

        function clearAll() {
            currentInput = '';
            previousInput = '';
            operation = null;
            updateDisplay();
        }

        function deleteDigit() {
            currentInput = currentInput.toString().slice(0, -1);
            updateDisplay();
        }

        function setOp(op) {
            if (currentInput === '') return;
            if (previousInput !== '') compute();
            operation = op;
            previousInput = currentInput;
            currentInput = '';
            updateDisplay();
        }

        function compute() {
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '×': result = prev * current; break;
                case '÷': 
                    if (current === 0) { alert("Cannot divide by zero"); clearAll(); return; }
                    result = prev / current; 
                    break;
                case '%': result = prev % current; break;
                default: return;
            }
            currentInput = result.toString();
            operation = null;
            previousInput = '';
            updateDisplay();
        }
    </script>
</body>
</html>
